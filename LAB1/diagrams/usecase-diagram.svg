<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="230" y="30" width="480" height="560" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="470" y="55" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Warehouse Inventory &amp; Pallet Location Tracker</text>

  <!-- Actor: Warehouse Operator (left) -->
  <g transform="translate(80,180)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="55" stroke="#222222" stroke-width="1.5"/>
    <line x1="-22" y1="30" x2="22" y2="30" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="-18" y2="90" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="18" y2="90" stroke="#222222" stroke-width="1.5"/>
    <text x="0" y="110" font-size="13" text-anchor="middle" fill="#222222">Warehouse</text>
    <text x="0" y="126" font-size="13" text-anchor="middle" fill="#222222">Operator</text>
  </g>

  <!-- Actor: Logistics Supervisor (left, lower) -->
  <g transform="translate(80,430)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="55" stroke="#222222" stroke-width="1.5"/>
    <line x1="-22" y1="30" x2="22" y2="30" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="-18" y2="90" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="18" y2="90" stroke="#222222" stroke-width="1.5"/>
    <text x="0" y="110" font-size="13" text-anchor="middle" fill="#222222">Logistics</text>
    <text x="0" y="126" font-size="13" text-anchor="middle" fill="#222222">Supervisor</text>
  </g>

  <!-- Use case ovals -->
  <ellipse cx="360" cy="90"  rx="90" ry="32" fill="#EAF3FC" stroke="#2266aa" stroke-width="1.2"/>
  <text x="360" y="95" font-size="13" text-anchor="middle" fill="#123a5c">Scan Pallet</text>

  <ellipse cx="600" cy="90"  rx="100" ry="32" fill="#FBEFE3" stroke="#b06a1a" stroke-width="1.2"/>
  <text x="600" y="95" font-size="13" text-anchor="middle" fill="#5c3a10">Flag Damaged Pallet</text>

  <ellipse cx="360" cy="185" rx="100" ry="34" fill="#EAF3FC" stroke="#2266aa" stroke-width="1.2"/>
  <text x="360" y="182" font-size="13" text-anchor="middle" fill="#123a5c">Place Pallet</text>
  <text x="360" y="198" font-size="13" text-anchor="middle" fill="#123a5c">in Rack</text>

  <ellipse cx="600" cy="185" rx="100" ry="34" fill="#EAF3FC" stroke="#2266aa" stroke-width="1.2"/>
  <text x="600" y="182" font-size="13" text-anchor="middle" fill="#123a5c">Validate Weight</text>
  <text x="600" y="198" font-size="13" text-anchor="middle" fill="#123a5c">Limit</text>

  <ellipse cx="360" cy="285" rx="100" ry="32" fill="#EAF3FC" stroke="#2266aa" stroke-width="1.2"/>
  <text x="360" y="290" font-size="13" text-anchor="middle" fill="#123a5c">Log Stock Movement</text>

  <ellipse cx="360" cy="440" rx="100" ry="32" fill="#EAF6EC" stroke="#2a8f4d" stroke-width="1.2"/>
  <text x="360" y="445" font-size="13" text-anchor="middle" fill="#155e2c">Locate SKU Pallet</text>

  <ellipse cx="360" cy="530" rx="110" ry="32" fill="#EAF6EC" stroke="#2a8f4d" stroke-width="1.2"/>
  <text x="360" y="535" font-size="13" text-anchor="middle" fill="#155e2c">View Occupancy Dashboard</text>

  <!-- Actor associations (solid lines) -->
  <line x1="102" y1="180" x2="270" y2="100" stroke="#222222" stroke-width="1"/>
  <line x1="102" y1="185" x2="260" y2="185" stroke="#222222" stroke-width="1"/>
  <line x1="102" y1="195" x2="270" y2="280" stroke="#222222" stroke-width="1"/>

  <line x1="102" y1="425" x2="260" y2="440" stroke="#222222" stroke-width="1"/>
  <line x1="102" y1="435" x2="250" y2="525" stroke="#222222" stroke-width="1"/>

  <!-- include relationship: Place Pallet in Rack --> Validate Weight Limit -->
  <line x1="460" y1="185" x2="500" y2="185" stroke="#555555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="480" y="170" font-size="11" text-anchor="middle" fill="#555555">&#171;include&#187;</text>

  <!-- extend relationship: Flag Damaged Pallet --> Scan Pallet -->
  <line x1="500" y1="90" x2="450" y2="90" stroke="#555555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="480" y="75" font-size="11" text-anchor="middle" fill="#555555">&#171;extend&#187;</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="470" y="600" font-size="11" text-anchor="middle" fill="#666666">Solid lines = actor associations | Dashed arrows = include/extend relationships</text>
</svg>
